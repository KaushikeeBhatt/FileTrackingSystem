name: Comprehensive CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM for security scan

jobs:
  build-and-test:
    name: Build, Test, and Scan
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for CodeQL

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run TypeScript check
      run: npm run type-check

    - name: Run unit and integration tests
      run: npm test && npm run test:integration
      env:
        MONGODB_URI: mongodb://localhost:27017/file-tracking-test
        JWT_SECRET: test-jwt-secret-key

    - name: Build application
      run: npm run build
      env:
        MONGODB_URI: mongodb://localhost:27017/file-tracking-build
        JWT_SECRET: build-jwt-secret-key

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Start application for E2E tests
      run: npm run start &
      env:
        MONGODB_URI: mongodb://localhost:27017/file-tracking-e2e
        JWT_SECRET: e2e-test-jwt-secret
        PORT: 3000

    - name: Wait for application to be ready
      run: npx wait-on http://localhost:3000 --timeout 60000

    - name: Run Playwright E2E tests
      run: npm run test:e2e
      env:
        BASE_URL: http://localhost:3000

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Run dependency vulnerability audit
      run: npm audit --audit-level=moderate

    - name: Run Snyk security scan
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule'
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: monitor
        args: --severity-threshold=medium

    - name: Upload test coverage
      uses: codecov/codecov-action@v4
      if: success() || failure()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage/coverage-final.json
        fail_ci_if_error: false
