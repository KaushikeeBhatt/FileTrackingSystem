name: Comprehensive CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM for security scan

jobs:
  build-and-test:
    name: Build, Test, and Scan
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for CodeQL

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run ESLint
      run: pnpm run lint

    - name: Run TypeScript check
      run: pnpm run type-check

    # - name: Run unit and integration tests
    #   run: npm test && npm run test:integration
    - name: Run unit tests
      run: pnpm test -- --coverage=false
      env:
        CI: true
        SWC_BINARY_PATH: /usr/local/lib/node_modules/@swc/core-linux-x64-gnu/swc.linux-x64-gnu.node
        MONGODB_URI: mongodb://localhost:27017/file-tracking-test
        JWT_SECRET: this-is-a-test-secret-key-must-be-32-chars-long
        NODE_ENV: test
        BASE_URL: http://localhost:3000
        MAX_FILE_SIZE: 10485760  # 10MB
        ALLOWED_FILE_TYPES: application/pdf,image/jpeg,image/png

    - name: Build application
      run: pnpm run build
      env:
        MONGODB_URI: mongodb://localhost:27017/file-tracking-build
        JWT_SECRET: this-is-a-test-secret-key-must-be-32-chars-long
        NODE_ENV: production
        BASE_URL: http://localhost:3000
        MAX_FILE_SIZE: 10485760  # 10MB
        ALLOWED_FILE_TYPES: application/pdf,image/jpeg,image/png

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run Playwright E2E tests
      run: pnpm run test:e2e
      env:
        BASE_URL: http://localhost:3000
        MONGODB_URI: mongodb://localhost:27017/file-tracking-e2e
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        PORT: 3000

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Run dependency vulnerability audit
      run: pnpm audit --audit-level=moderate

    - name: Run Snyk security scan
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule'
      uses: snyk/actions/node@0.4.0
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: monitor
        args: --severity-threshold=medium --json

    - name: Upload test coverage
      uses: codecov/codecov-action@v4
      if: success() || failure()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage/coverage-final.json
        fail_ci_if_error: false
